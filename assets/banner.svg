<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Jayler — building tools for coding agents and Roblox">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotMask"><rect width="1000" height="260" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1000" height="260" rx="18"/></clipPath>
    <style>
      .glow { animation: breathe 6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .glow2 { animation-delay: 3s; }
      @keyframes breathe { 0%,100% { opacity: .7; transform: scale(1) } 50% { opacity: 1; transform: scale(1.08) } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="#0a0a0f"/>
    <rect width="1000" height="260" fill="url(#dots)" mask="url(#dotMask)"/>
    <circle class="glow" cx="820" cy="40" r="230" fill="url(#glowA)"/>
    <circle class="glow glow2" cx="960" cy="230" r="180" fill="url(#glowB)"/>

    <text class="mono" x="64" y="72" fill="#71717a" font-size="15">~/jayler <tspan fill="#a78bfa">❯</tspan> whoami</text>
    <text class="sans" x="62" y="140" fill="#fafafa" font-size="64" font-weight="700" letter-spacing="-1.5">Jayler</text>
    <rect x="66" y="158" width="72" height="4" rx="2" fill="url(#accent)"/>
    <text class="sans" x="64" y="198" fill="#a1a1aa" font-size="21">Building tools for coding agents &amp; Roblox<tspan class="cursor" fill="#22d3ee">▍</tspan></text>

    <g class="mono" font-size="13">
      <rect x="742" y="186" width="66" height="28" rx="14" fill="#18181b" stroke="#27272a"/>
      <text x="775" y="205" fill="#e4e4e7" text-anchor="middle">Rust</text>
      <rect x="816" y="186" width="66" height="28" rx="14" fill="#18181b" stroke="#27272a"/>
      <text x="849" y="205" fill="#e4e4e7" text-anchor="middle">Luau</text>
      <rect x="890" y="186" width="78" height="28" rx="14" fill="#18181b" stroke="#27272a"/>
      <text x="929" y="205" fill="#e4e4e7" text-anchor="middle">Roblox</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="259" rx="18" fill="none" stroke="#27272a"/>
</svg>
