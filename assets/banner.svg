<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Jayler — building tools for coding agents and Roblox">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d22"/>
      <stop offset="1" stop-color="#132a52"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1000" height="260" rx="18"/></clipPath>
    <style>
      .t { animation: tw 3.2s ease-in-out infinite; }
      .d1 { animation-delay: .4s } .d2 { animation-delay: 1.1s } .d3 { animation-delay: 1.9s } .d4 { animation-delay: 2.6s }
      @keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
      .guide { animation: pulse 4s ease-in-out infinite; transform-origin: 702px 62px; }
      @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
      .wave { animation: drift 9s linear infinite; }
      @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-200px) } }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#sky)"/>

    <!-- background stars -->
    <g fill="#dfe8ff">
      <circle class="t" cx="40" cy="30" r="1.2"/>
      <circle class="t d2" cx="120" cy="200" r="1"/>
      <circle class="t d1" cx="210" cy="40" r="1.4"/>
      <circle class="t d3" cx="330" cy="22" r="1"/>
      <circle class="t d4" cx="390" cy="60" r="1.3"/>
      <circle class="t d2" cx="470" cy="34" r="1"/>
      <circle class="t" cx="540" cy="90" r="1.2"/>
      <circle class="t d3" cx="600" cy="28" r="1.5"/>
      <circle class="t d1" cx="640" cy="160" r="1"/>
      <circle class="t d4" cx="580" cy="190" r="1.2"/>
      <circle class="t d2" cx="940" cy="30" r="1.3"/>
      <circle class="t" cx="960" cy="150" r="1"/>
      <circle class="t d3" cx="880" cy="180" r="1.4"/>
      <circle class="t d1" cx="740" cy="190" r="1"/>
      <circle class="t d4" cx="660" cy="60" r="1"/>
      <circle class="t d2" cx="30" cy="150" r="1"/>
      <circle class="t d3" cx="270" cy="185" r="1.2"/>
      <circle class="t" cx="440" cy="170" r="1"/>
    </g>

    <!-- Big Dipper (海斗) -->
    <g stroke="#8fb0ff" stroke-opacity=".35" stroke-width="1.4" fill="none">
      <polyline points="702,62 708,118 772,128 778,80 702,62"/>
      <polyline points="778,80 828,74 872,66 920,92"/>
    </g>
    <g fill="#ffffff">
      <circle cx="708" cy="118" r="3"/>
      <circle cx="772" cy="128" r="2.6"/>
      <circle class="t d1" cx="778" cy="80" r="2.4"/>
      <circle cx="828" cy="74" r="3"/>
      <circle class="t d3" cx="872" cy="66" r="2.8"/>
      <circle cx="920" cy="92" r="3"/>
    </g>
    <!-- the guiding star -->
    <g class="guide">
      <circle cx="702" cy="62" r="16" fill="url(#glow)"/>
      <path d="M702 50 L704.5 59.5 L714 62 L704.5 64.5 L702 74 L699.5 64.5 L690 62 L699.5 59.5 Z" fill="#fff4cc"/>
    </g>

    <!-- name -->
    <text x="64" y="118" fill="#ffffff" font-size="60" font-weight="700" letter-spacing="1">Jayler</text>
    <text x="66" y="156" fill="#a9bce6" font-size="21">building tools for coding agents &amp; Roblox</text>
    <text x="66" y="186" fill="#ffe9a8" font-size="15" letter-spacing="3" opacity=".85">✦ FOLLOW THE STARS</text>

    <!-- sea -->
    <g class="wave">
      <path d="M0 236 q25 -10 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V260 H0 Z" fill="#1f4f8f" fill-opacity=".55"/>
      <path d="M0 246 q25 -8 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V260 H0 Z" fill="#2b6cb0" fill-opacity=".5"/>
    </g>
  </g>
</svg>
